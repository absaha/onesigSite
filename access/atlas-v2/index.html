<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneSig Atlas · Tax Intelligence Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C1C1C;--muted:#707070;--canvas:#F7F7F5;--surface:#FFFFFF;--line:#E4E4E1;--orange:#B84C16;--coral:#FF8D6B;
--ok:#2E6B3E;--okbg:#EAF2EC;--warn:#8A6100;--warnbg:#F7F0DC;--bad:#A8321F;--badbg:#F9E9E5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}.serif{font-family:'Source Serif 4',serif}
button{font-family:inherit;cursor:pointer;font-size:13px}
a{color:inherit;text-decoration:none}
h1,h2,h3{letter-spacing:-0.02em}
#app{display:flex;min-height:100vh}
/* sidebar */
.sb{width:216px;background:var(--canvas);border-right:1px solid var(--line);padding:14px 10px;position:fixed;top:0;bottom:0;overflow-y:auto;z-index:20;display:flex;flex-direction:column}
.sb-top{display:flex;align-items:center;gap:8px;padding:2px 8px 12px}
.sb-top .lg{width:24px;height:24px;background:var(--ink);color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10.5px}
.sb-top .ws{font-size:13px;font-weight:600}
.sb-top .car{color:var(--muted);font-size:10px}
.createbtn{margin:0 4px 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-weight:500;font-size:13px;width:calc(100% - 8px)}
.createbtn:hover{background:#fff;border-color:#ccc}
.sit{display:flex;align-items:center;gap:9px;padding:6.5px 9px;border-radius:8px;color:#3b3b3b;font-size:13px;font-weight:500;margin-bottom:1px}
.sit:hover{background:rgba(28,28,28,.05)}
.sit.on{background:rgba(28,28,28,.08);font-weight:600;color:var(--ink)}
.sit .ic{width:15px;text-align:center;opacity:.7;font-size:12px}
.sub{padding-left:33px;font-size:12.5px;color:#555;display:block;padding-top:4px;padding-bottom:4px;border-radius:7px}
.sub:hover{background:rgba(28,28,28,.05)}
.sb .grp{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9a9a96;padding:14px 9px 5px}
.sb-bottom{margin-top:auto;padding:8px}
.main{margin-left:216px;flex:1;min-height:100vh}
.wrap{max-width:1060px;margin:0 auto;padding:34px 40px 90px}
/* ask bar */
.askwrap{max-width:760px;margin:0 auto}
.brandword{font-family:'Source Serif 4',serif;font-size:34px;font-weight:700;text-align:center;margin:44px 0 30px}
.ctxrow{display:flex;gap:14px;margin-bottom:8px;font-size:12.5px;color:#444}
.ctxrow span{cursor:pointer}
.ctxrow span:hover{color:var(--ink)}
.askbox{background:#F0F0EE;border-radius:16px;padding:18px 18px 12px;border:1px solid transparent}
.askbox:focus-within{border-color:#ccc;background:#fff}
.askbox textarea{width:100%;border:none;background:none;resize:none;font-family:inherit;font-size:15px;outline:none;min-height:64px;color:var(--ink)}
.askfoot{display:flex;align-items:center;gap:14px;font-size:12.5px;color:#555;margin-top:6px}
.askfoot .go{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{background:var(--ink);color:#fff;border:none;border-radius:99px;padding:8px 18px;font-weight:500;white-space:nowrap}
.btn:hover{background:#333}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid rgba(0,0,0,.13)}
.btn.sec:hover{background:var(--canvas)}
.btn.sm{padding:5px 13px;font-size:12px}
.srcchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.srcchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:500}
.srcchip:hover{border-color:#bbb;cursor:pointer}
.srcchip .sq{width:15px;height:15px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.card.hov:hover{border-color:#bfbfbc;cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sectionlbl{font-size:13px;font-weight:600;color:#444;margin:26px 0 10px}
.wfcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px 17px;display:flex;flex-direction:column;min-height:128px}
.wfcard:hover{border-color:#bfbfbc;cursor:pointer}
.wfcard b{font-size:13.5px;line-height:1.35}
.wfcard p{font-size:12px;color:var(--muted);margin-top:5px;flex:1}
.wfcard .ft{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#777;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;border-radius:99px;padding:2px 9px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}.pill.neu{background:rgba(28,28,28,.06);color:#444}
.pill.or{background:#F7E8DF;color:var(--orange)}
.idt{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;background:rgba(28,28,28,.06);border-radius:5px;padding:1.5px 6px;white-space:nowrap}
.pagetitle{font-size:22px;font-weight:700;margin-bottom:3px}
.pagesub{font-size:13px;color:var(--muted);margin-bottom:20px}
.topband{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.topband .sp{margin-left:auto;display:flex;gap:8px}
/* vault cards */
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.vcard:hover{border-color:#bfbfbc;cursor:pointer}
.vcard .thumb{height:96px;background:#F0F0EE;display:flex;align-items:center;justify-content:center;font-size:26px;color:#b9b9b5}
.vcard .meta{padding:11px 14px}
.vcard .meta b{font-size:13px}
.vcard .meta .small{font-size:11.5px;color:var(--muted)}
/* review grid */
.gridtbl{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface)}
.gridtbl th{position:sticky;top:0;background:#FAFAF9;text-align:left;font-size:11px;font-weight:600;color:#555;padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid #EFEFEC;white-space:nowrap}
.gridtbl td{padding:8px 12px;border-bottom:1px solid #F1F1EF;border-right:1px solid #F4F4F2;vertical-align:top}
.gridtbl tr:hover td{background:#FBFBFA}
.gridtbl .fname{font-weight:500;white-space:nowrap;max-width:250px;overflow:hidden;text-overflow:ellipsis}
.gridtbl .grph{background:#F4F4F2;font-size:10.5px;font-weight:700;color:#666;letter-spacing:.05em;padding:6px 12px}
.toolrow{display:flex;gap:10px;align-items:center;padding:10px 0;font-size:12.5px;color:#444}
.toolrow .t{display:flex;gap:6px;align-items:center;cursor:pointer;border-radius:7px;padding:4px 9px}
.toolrow .t:hover{background:rgba(28,28,28,.05)}
/* thread */
.thread{max-width:720px}
.uq{background:#F0F0EE;border-radius:13px;padding:13px 17px;font-size:14px;margin:22px 0}
.ans{font-size:14px;line-height:1.7}
.ans h3{font-size:15px;margin:18px 0 6px}
.ans .ref{display:inline-flex;align-items:center;justify-content:center;background:rgba(28,28,28,.07);border-radius:5px;font-size:10px;font-weight:600;min-width:17px;height:15px;padding:0 3px;margin:0 1.5px;vertical-align:2px;cursor:pointer}
.ans ul{padding-left:20px;margin:8px 0}
.srcbox{border:1px solid var(--line);border-radius:11px;padding:10px 14px;display:inline-flex;gap:10px;align-items:center;font-size:12px;margin-top:14px}
.ansacts{display:flex;gap:14px;font-size:12px;color:#555;margin-top:12px}
.ansacts span{cursor:pointer;display:flex;gap:5px;align-items:center}
.ansacts span:hover{color:var(--ink)}
/* editor split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin-top:18px;min-height:430px}
.split .left{border-right:1px solid var(--line);padding:18px 20px;background:#FBFBFA;font-size:12.5px;overflow-y:auto;max-height:520px}
.split .right{padding:0;display:flex;flex-direction:column}
.edtoolbar{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:9px 16px;font-size:12px;color:#555}
.edtoolbar b{letter-spacing:0}
.edbody{padding:20px 24px;font-size:13px;line-height:1.75;overflow-y:auto;flex:1;outline:none}
.edbody[contenteditable]:focus{background:#FFFEFC}
/* run progress */
.runwrap{display:grid;grid-template-columns:1fr 280px;gap:16px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 18px;height:fit-content}
.prog .st{display:flex;gap:9px;align-items:center;padding:6px 0;font-size:12.5px;color:#555}
.prog .st .ck{width:17px;height:17px;border-radius:99px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.prog .st.done .ck{background:var(--ink);border-color:var(--ink);color:#fff}
.prog .st.doing .ck{border-color:var(--orange);color:var(--orange)}
.prog .st.doing{color:var(--ink);font-weight:600}
.ctx-tabs{display:flex;gap:2px;margin:14px 0 8px;border-bottom:1px solid var(--line)}
.ctx-tab{font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 10px;border-bottom:2px solid transparent;cursor:pointer}
.ctx-tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.memitem{font-size:11.5px;color:#555;padding:5px 0;border-bottom:1px solid #F2F2F0;display:flex;gap:7px}
.memitem .n{background:rgba(28,28,28,.07);border-radius:4px;font-size:9.5px;font-weight:700;padding:0 5px;height:15px;display:inline-flex;align-items:center}
/* space */
.spacehead{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.spacehead .av{width:40px;height:40px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.spacehead h1{font-family:'Source Serif 4',serif;font-size:28px}
.tabrow{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 20px}
.tabrow .tb{padding:8px 15px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabrow .tb.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.act{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #F1F1EF;font-size:12.5px}
.act .ic2{width:22px;height:22px;border-radius:99px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;background:#fff}
.act .tm{color:var(--muted);font-size:11px}
.askfab{position:fixed;right:26px;bottom:26px;width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.askfab:hover{transform:scale(1.06)}
.askovl{position:fixed;inset:0;background:rgba(28,28,28,.35);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding-top:9vh}
.askpanel{width:min(720px,92vw);background:#fff;border-radius:16px;padding:22px;max-height:78vh;overflow:auto;box-shadow:0 18px 60px rgba(0,0,0,.25)}
.askmini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:22px}
.askmini input{width:100%;border:none;outline:none;font-size:14px;font-family:inherit}
.askmini .row{display:flex;gap:10px;margin-top:8px;color:#666;font-size:13px;align-items:center}
/* modal */
.mwrap{position:fixed;inset:0;background:rgba(28,28,28,.45);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:60px 30px}
.mwrap.open{display:flex}
.modal{background:var(--surface);border-radius:15px;max-width:720px;width:100%;max-height:80vh;overflow-y:auto}
.mh{display:flex;align-items:center;padding:15px 22px;border-bottom:1px solid var(--line)}
.mh b{flex:1;text-align:center;font-size:14px}
.mh .x{cursor:pointer;color:#888}
.mb{padding:20px 24px}
.colrow{display:grid;grid-template-columns:130px 200px 1fr 50px;gap:10px;padding:9px 4px;border-bottom:1px solid #F1F1EF;font-size:12.5px;align-items:center}
.colrow .ty{display:flex;gap:6px;align-items:center;color:#555;font-size:12px}
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;border-radius:99px;padding:9px 20px;font-size:12.5px;box-shadow:0 4px 18px rgba(0,0,0,.18);animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.cellyes{color:var(--ok);font-weight:600}.cellno{color:#999}
.small{font-size:11.5px;color:var(--muted)}
.searchtop{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:12px;color:#888;min-width:180px}
/* detail drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:360px;background:var(--surface);border-left:1px solid var(--line);z-index:60;box-shadow:-6px 0 24px rgba(0,0,0,.07);padding:18px 20px;overflow-y:auto;display:none}
.drawer.open{display:block}
.drawer h4{font-size:14px;margin-bottom:2px}
.drawer .fld{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#999;margin:16px 0 5px;display:flex;align-items:center}
.drawer .fld .edit{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;color:#777;cursor:pointer;font-size:11px}
.drawer .val{font-size:13px;color:#333}
.srclink{color:var(--orange);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.assign{border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;color:#555;width:100%;background:#fff;cursor:pointer;text-align:left}
.soonpill{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.04em;background:#F7E8DF;color:var(--orange);border-radius:99px;padding:1px 7px}
.presence{display:flex;align-items:center}
.presence .pv{width:24px;height:24px;border-radius:99px;background:var(--ink);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-6px}
.presence .pv:first-child{margin-left:0}
.presence .pv.k{background:#5a5a56}.presence .pv.v{background:#8a8a85}
.folderhead{display:flex;gap:8px;align-items:center;background:#F4F4F2;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:600;color:#555;margin:14px 0 6px;cursor:pointer}
.frow{display:flex;gap:11px;align-items:center;padding:9px 6px;border-bottom:1px solid #F1F1EF;font-size:13px}
.frow:last-child{border-bottom:none}
.frow:hover{background:#FBFBFA}
.chk{width:16px;height:16px;border:1.5px solid #ccc;border-radius:4px;flex-shrink:0}
.ghost{opacity:.55}
.voicebtn{display:inline-flex;align-items:center;gap:7px;border:1px dashed #bbb;background:none;border-radius:99px;padding:6px 15px;font-size:12.5px;color:#555;cursor:pointer}
.voicebtn:hover{border-color:var(--ink);color:var(--ink)}
.progressbar{height:8px;background:rgba(28,28,28,.08);border-radius:99px;overflow:hidden}
.progressbar>div{height:100%;background:var(--ink);border-radius:99px;transition:width .5s ease}
.steps{display:flex;gap:8px}
.step{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);padding-top:10px;border-top:3px solid var(--line)}
.step.done{border-color:var(--ink);color:var(--ink)}
.step.cur{border-color:var(--coral);color:var(--orange)}
.conopt{border:1.5px solid var(--line);border-radius:11px;padding:12px 15px;margin-top:9px;cursor:pointer;background:var(--surface)}
.conopt:hover{border-color:#aaa}
.conopt.sel{border-color:var(--ink);background:#FAFAFA}
.maprow{display:grid;grid-template-columns:1fr 30px 1fr 150px;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #F0F0F0;font-size:13px}
.maprow .arrow{color:var(--muted);text-align:center}
.mapfield{font-family:'IBM Plex Mono',monospace;font-size:12px;background:rgba(28,28,28,.05);border-radius:7px;padding:5px 10px;display:inline-block}
.mapfield.canon{background:#F7E8DF;color:var(--orange)}
.fld{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#999;margin:14px 0 5px}
.val{font-size:13px;color:#333}
.filterrow{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:12.5px;font-weight:500;color:#444;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.anat{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #F1F1EF;font-size:13px}
.anat:last-child{border-bottom:none}
.anat .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#999;padding-top:2px}
.flow{display:flex;flex-direction:column;align-items:center}
.fnode{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12px;width:250px;text-align:center}
.fnode.dec{border-color:var(--orange);background:#FBF3EC}
.fline{width:1.5px;height:16px;background:#C9C9C4}
.fbranch{display:flex;gap:26px;align-items:flex-start}
.selbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:9px 18px;display:flex;gap:10px;align-items:center;z-index:55;box-shadow:0 6px 22px rgba(0,0,0,.2);font-size:13px}
.selbar .btn{background:#fff;color:var(--ink)}
.selbar .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.chk.on{background:var(--ink);border-color:var(--ink);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.selrow{background:#FBF7F4}
.frow{cursor:pointer}
@media(max-width:980px){.grid3,.grid4{grid-template-columns:1fr 1fr}.runwrap,.split{grid-template-columns:1fr}.sb{display:none}.main{margin-left:0}}
@keyframes nsfade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<div class="drawer" id="cellDrawer"></div>
<div class="mwrap" id="colModal">
 <div class="modal">
  <div class="mh"><span></span><b>Column builder</b><span class="x" onclick="closeModal()">✕</span></div>
  <div class="mb">
    <div style="font-size:13px;font-weight:600;margin-bottom:8px">What do you want to know about each file?</div>
    <div class="askbox" style="margin-bottom:12px"><textarea id="colq">Is a TRN present and valid (15-digit, 1…03)? What invoice type code is used? Is the emirate code populated? Is this an RCM transaction? What is the VAT amount and does it round at invoice level?</textarea></div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn sm" onclick="genCols()">Generate columns</button></div>
    <div id="colsout"></div>
  </div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s);
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3800)}
function nav(r){location.hash=r}
function closeModal(){$('#colModal').classList.remove('open')}
function genCols(){
 $('#colsout').innerHTML=`
  <div class="colrow" style="font-weight:700;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.05em"><span>Type</span><span>Column header</span><span>Query</span><span></span></div>
  ${[["Classification","TRN present & valid","Does the buyer carry a valid 15-digit TRN (1…03 format)?"],
     ["Classification","Invoice type code","Which PINT AE type code applies · 380, 480, 381 or 81?"],
     ["Classification","Emirate code","Is the emirate code populated for place-of-supply?"],
     ["Classification","RCM transaction","Is this a reverse-charge (category AE) transaction?"],
     ["Currency","VAT amount","What is the VAT amount on the document?"],
     ["Classification","Rounding level","Does rounding occur at invoice level only?"]]
   .map(c=>`<div class="colrow"><span class="ty">▤ ${c[0]}</span><b>${c[1]}</b><span style="color:#555">${c[2]}</span><span style="color:#999">✎ 🗑</span></div>`).join('')}

   </tbody></table>
   <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
    <button class="btn sec sm" onclick="vqAddCol()">＋ Add column</button><span style="flex:1"></span>
    <button class="btn sec sm" onclick="vqStep=vqMethod?1:0;render()">← Back</button>
    <button class="btn sec sm" onclick="vqNew()">Cancel</button>
    <button class="btn sm" onclick="vqGo()">Run query · ${vqCols.filter(c=>c.on).length} columns × ${vqSel().length} files</button></div>
  </div>`;
 else{
  const cols=vqCols.filter(c=>c.on);
  const FL=vqSel();
  if(vqFill<FL.length)setTimeout(()=>{vqFill++;render()},420);
  else if(!vqSavedFlag){vqSavedFlag=true;vqSave()}
  body=`${bar(3)}
  <div style="margin-bottom:10px"><button class="btn sec sm" onclick="vqStep=2;render()">← Back · check the columns</button></div>
  ${vqFill>=FL.length?`<div class="small" style="margin-bottom:10px">Saved in <a href="#/vqfolder" style="text-decoration:underline"><b>Vault › Queries</b></a> · run by <b>you</b> · <span class="mono">v${vqVer()}</span> · re-run under the same name to create v${vqVer()+1}</div>`:''}
  ${vqFill<FL.length?`<div class="card" style="max-width:340px;margin-bottom:12px;display:flex;gap:10px;align-items:center"><span>◐</span><div><b style="font-size:13px">Reviewing documents…</b><div class="small">Estimated less than a minute · ${vqFill} of ${FL.length} done</div></div></div>`:''}
  <div style="border:1px solid var(--line);border-radius:13px;overflow:auto;background:var(--surface)">
  <table class="gridtbl"><thead><tr><th style="width:26px">#</th><th style="min-width:170px">Name</th>${cols.map(c=>`<th>${c.t}</th>`).join('')}</tr></thead><tbody>
  ${FL.map((f,i)=>{const ri=VQFILES.indexOf(f);return `<tr><td class="small">${i+1}</td><td class="fname">▲ ${f}</td>
    ${cols.map((c,ci)=>{const v=i<vqFill?vqCell(c,ri<0?0:ri):null;
      return v===null?`<td class="small" style="color:#bbb">●●●</td>`
       :`<td class="${/^Yes/.test(v)?'cellyes':/^No|missing|empty|should/.test(v)?'cellno':''}" style="font-size:12px;cursor:pointer" title="Click for the citation" onclick="vqCiteOpen(${i},${ci})">${v}</td>`}).join('')}
   </tr>`}).join('')}
  </tbody></table></div>
  ${vqFill>=FL.length?`<p class="small" style="margin-top:10px">Every cell is cited to its exact location · click one to see the source. Answers behave like the question bank · click any cell for its citation and preview.</p>
  <div class="card" style="max-width:680px;margin-top:14px"><b style="font-size:13px">Keep querying these ${FL.length} files</b>
   <div style="display:flex;gap:8px;margin-top:8px">
    <input id="vqfu" placeholder="e.g. What are the payment terms on each document?" style="flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font:inherit;font-size:13px;background:var(--canvas)" onkeydown="if(event.key==='Enter'){vqFollowUp()}">
    <button class="btn sm" onclick="vqFollowUp()">Add as column</button></div>
   <div class="small" style="margin-top:6px">Each follow-up becomes a new column on the same table · same files, growing picture.</div></div>`:''}`;
 }
 return frame('vault',`
  <div class="small"><a href="#/queries">← Queries</a> · 🗀 ${vqFolder}</div>
  <div class="topband" style="margin-top:6px"><div><div class="pagetitle">${vqName} <span class="small" style="cursor:pointer" onclick="toast('Rename the query')">✎</span></div>
   <div class="pagesub" style="margin:0">Query a folder · every answer comes back as a table, cited per cell.</div></div>
   ${vqStep===3&&vqFill>=VQFILES.length?`<div class="sp">
    <button class="btn sec sm" onclick="toast('Share link copied · teammates see this same table')">⇗ Share</button>
    <button class="btn sec sm" onclick="toast('Saved as a workflow · runs on any folder, from the Workflows tab')">▤ Save as workflow</button>
    <button class="btn sm" onclick="toast('Export started · table + citations to .xlsx')">⇩ Export</button></div>`:''}</div>
  ${body}`);
}

/* ---------- router ---------- */
const R={assistant:pgAssistant,thread:pgThread,vault:pgVault,vaultview:pgVaultView,home:pgHomeDash,journey:pgJourney,steps:pgSteps,lists:pgLists,newlist:pgNewList,listview:pgListView,vquery:pgVQuery,queries:pgVQHome,vqfolder:pgVQFolder,apfolder:pgAPFolder,aprun:pgAPRun,newspace:pgNewSpace,dbrun:pgDBRun,pmrun:pgPMRun,dlrun:pgDLRun,anrun:pgANRun,workflows:pgWorkflows,wfdetail:pgWfDetail,mapreview:pgMapReviewFull,mapartifact:pgMapArtifact,valrun:pgValRun,valreport:pgValReport,gapreport:pgGapReport,produce:pgProduce,deliverables:pgDeliverables,ask:pgAsk,wfbuilder:pgWfBuilder,dcrun:pgDCRun,collect:pgCollect,run:pgRun,review:pgReview,fieldgrid:pgFieldGrid,qbank:pgQbank,docreview:pgDocReview,agentrun:pgAgentRun,checklists:pgChecklists,artifacts:pgArtifacts,processmap:pgProcessMap,builder:pgBuilder,space:pgSpace,history:pgHistory,library:pgLibrary,guidance:pgGuidance};
let lastRoute=null, jumpFlag=false;
function resetRoute(r){
 if(r==='aprun'){apStep=0;apArt=null;apL1=null;apL2=null;apDone=false}
 if(r==='dcrun')dcStep=0;
 if(r==='valrun')valStep=0;
 if(r==='vquery'){vqStep=0;vqMethod=null;vqCols=[];vqFill=0;vqSavedFlag=false}
 if(r==='agentrun')agentStep=0;
 if(r==='dbrun'){dbStep=0;dbSrc=null}
 if(r==='pmrun')pmSrc=null;
 if(r==='dlrun'){dlStep=0;dlTpl=null;dlSaved=false;dlSel.clear()}
 if(r==='anrun'){anStep=0;anTpl=null;anSel.clear()}
}
function render(){
 let r=(location.hash||'#/home').replace('#/','')||'home';
 if(!R[r])r='home';if(r==='assistant')r='home';
 if(r!==lastRoute){if(!jumpFlag)resetRoute(r);jumpFlag=false;lastRoute=r}
 if(r!=='run')runStep=runStep>=5?runStep:0;
 document.getElementById('root').innerHTML=`<div id="app">${R[r](r)}</div>`;
 document.getElementById('cellDrawer')?.classList.remove('open');
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(location.hash==='#/run')runStep=0;render()});
render();
</script>
</body>
</html>
